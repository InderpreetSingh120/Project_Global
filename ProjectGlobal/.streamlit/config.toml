# Streamlit Theme Configuration — Project Global
# Professional theme with light/dark support, custom fonts, and semantic colors

[theme]
base = "light"
primaryColor = "#3B82F6"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
linkColor = "#3B82F6"
codeTextColor = "#172033"
codeBackgroundColor = "#EEF2F7"
borderColor = "#DDE3EA"

# Semantic colors for badges, markdown coloring, sparklines
redColor = "#EF4444"
orangeColor = "#F59E0B"
yellowColor = "#F59E0B"
greenColor = "#10B981"
blueColor = "#3B82F6"
violetColor = "#9333EA"
grayColor = "#6B7280"

# Semantic background/text variants (light theme)
greenBackgroundColor = "#D1FAE5"
greenTextColor = "#065F46"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
orangeBackgroundColor = "#FEF3C7"
orangeTextColor = "#92400E"
blueBackgroundColor = "#DBEAFE"
blueTextColor = "#1E40AF"
violetBackgroundColor = "#F3E8FF"
violetTextColor = "#6B21A8"

# Chart colors
chartCategoricalColors = ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#9333EA", "#06B6D4", "#F97316", "#EC4899", "#65A30D", "#8B5CF6"]
chartSequentialColors = ["#F0F9FF", "#E0F2FE", "#BAE6FD", "#7DD3FC", "#38BDF8", "#0EA5E9", "#0284C7", "#0369A1", "#075985", "#0C4A6E"]

# Dataframe styling
dataframeBorderColor = "#DDE3EA"
dataframeHeaderBackgroundColor = "#EEF2F7"

# Typography — Google Fonts
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.875rem"
codeFontWeight = 400

headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 500]

linkUnderline = false

# Border and radius
baseRadius = "8px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

# Dark theme — native picker support
[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#171A21"
textColor = "#F3F4F6"
linkColor = "#60A5FA"
codeTextColor = "#F3F4F6"
codeBackgroundColor = "#20242D"
borderColor = "#2A303B"
redColor = "#F87171"
orangeColor = "#FBBF24"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#60A5FA"
violetColor = "#C084FC"
grayColor = "#9CA3AF"

# Semantic background/text variants (dark theme)
greenBackgroundColor = "#0F2A20"
greenTextColor = "#6EE7B7"
redBackgroundColor = "#3A1315"
redTextColor = "#FCA5A5"
orangeBackgroundColor = "#3A2A0F"
orangeTextColor = "#FCD34D"
blueBackgroundColor = "#122A4A"
blueTextColor = "#93C5FD"
violetBackgroundColor = "#2A1B3D"
violetTextColor = "#D8B4FE"

[theme.dark.sidebar]
backgroundColor = "#171A21"
secondaryBackgroundColor = "#20242D"
codeBackgroundColor = "#20242D"
textColor = "#F3F4F6"
borderColor = "#2A303B"
primaryColor = "#60A5FA"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
port = 8501

[browser]
gatherUsageStats = false
